name: Build installers

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

jobs:
  # A release must never reuse or go below a version already published, otherwise an
  # installed copy with that number could not tell whether it is up to date.
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches package.json and is newer than the latest release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag v$TAG does not match package.json version $VERSION"; exit 1
          fi
          LATEST=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || true)
          LATEST="${LATEST#v}"
          echo "package.json: $VERSION  latest release: ${LATEST:-none}"
          if [ -n "$LATEST" ]; then
            node -e '
              const p = v => v.split(".").map(n => parseInt(n, 10) || 0);
              const [a, b] = [p(process.argv[1]), p(process.argv[2])];
              for (let i = 0; i < Math.max(a.length, b.length); i++) {
                const d = (a[i] || 0) - (b[i] || 0);
                if (d) process.exit(d > 0 ? 0 : 1);
              }
              process.exit(1);
            ' "$VERSION" "$LATEST" || { echo "::error::Version $VERSION must be greater than the latest release $LATEST"; exit 1; }
          fi

  build:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            command: npm run build
            artifact: dist/*.exe
          - os: macos-latest
            name: macos
            command: npm run build:mac
            artifact: dist/*.dmg
          - os: ubuntu-latest
            name: linux
            command: npm run build:linux
            artifact: dist/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build ${{ matrix.name }} installer
        run: ${{ matrix.command }}
        env:
          # No signing certificates: builds are unsigned.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Build user manuals (PDF, English and Italian)
        if: matrix.name == 'windows'
        run: npm run manual

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: flowcast-${{ matrix.name }}
          path: |
            ${{ matrix.artifact }}
            dist/*.pdf
          if-no-files-found: error
          retention-days: 3
          retention-days: 1  # only needed to hand files to the release job; keeps Actions storage near zero

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Zip with installers and manuals (single download for the website)
        working-directory: dist
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          zip -9 -j "FlowCast-${VERSION}.zip" $(ls | grep -v -e '\.zip$' -e '^SHA256SUMS')

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
